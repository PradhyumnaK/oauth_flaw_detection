<!DOCTYPE html>
<html>
    <head>
        <title>Flows</title>
        <style>
            body {
                font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
                background-color: white;
                color: #222222;
                margin: 0;
                padding: 0;
            }
            .page {
                max-width: 960px;
                margin: 40px auto;
                padding: 0 16px;
            }
            h1 {
                margin-top: 0;
                font-size: 1.8rem;
            }
            a {
                color: #0056b3;
                text-decoration: none;
            }
            a:hover {
                text-decoration: underline;
            }
            .scenario {
                margin-bottom: 16px;
            }
            .scenario-title {
                font-weight: 600;
                margin-bottom: 4px;
            }
            .scenario-key {
                font-weight: 400;
                font-size: 0.85rem;
                color: #777777;
            }
            .run-links a {
                display: inline-block;
                margin-right: 8px;
                margin-bottom: 4px;
                font-size: 0.9rem;
            }
        </style>
    </head>
    <body>
        <div class="page">
            <h1>OAuth Flow Traces</h1>
            <a href="/">Home</a>
            {% for scenario, runs in scenarios.items() %}
                <div class="scenario">
                    <div class="scenario-title">
                        {{scenario_display_names.get(scenario, scenario)}}
                        <span class="scenario-key">({{scenario}})</span>
                    </div>
                    <div class="run-links">
                        {% for run in runs[:10] %}
                            <a href="{{url_for("show_flow", scenario=scenario, run=run)}}">Run {{run}}</a>
                        {% endfor %}
                    </div>
                </div>
        {% endfor %}

        </div>
    </body>
</html>
